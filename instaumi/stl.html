<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaUMI · STL downloads</title>
  <meta name="description" content="Browse and download InstaUMI assembly and individual part STL files.">
  <link rel="canonical" href="https://lihongcs.github.io/instaumi/stl.html">
  <meta name="theme-color" content="#F7F8F5">
  <link rel="stylesheet" href="../fonts/inter.css">
  <link rel="stylesheet" href="../typography.css?v=reading-scale">
  <link rel="stylesheet" href="style.css?v=reading-scale">
  <link rel="stylesheet" href="viewer.css?v=reading-scale">
  <link rel="stylesheet" href="stl.css?v=reading-scale">
  <script type="module" src="stl.js"></script>
</head>
<body>
  <header class="site-header wrap">
    <a href="./"><span aria-hidden="true">←</span> InstaUMI project</a>
    <a id="viewer-link" href="viewer.html">3D assembly viewer</a>
  </header>
  <main class="wrap">
    <div class="viewer-heading">
      <h1>STL downloads</h1>
      <nav id="variant-switcher" class="variant-switcher" aria-label="Gripper variant"></nav>
    </div>
    <section class="stl-library" aria-labelledby="variant-name">
      <h2 id="variant-name">Hardware files</h2>
      <p class="viewer-note">STL geometry uses millimeter coordinates. Assemblies are exported as a single mesh file with the parts in place.</p>
      <p id="variant-note" class="viewer-note" hidden></p>
      <p id="library-status" role="status">Loading STL files…</p>
      <ul id="stl-list" class="stl-list" hidden></ul>
    </section>
    <noscript><p>The STL list requires JavaScript. <a href="./#hardware">View hardware archives.</a></p></noscript>
  </main>
</body>
</html>
